name: CI — build & deploy to Hostinger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # BUILD — typecheck + compile (also runs on PRs for validation)
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (tsc typecheck + vite compile)
        run: npm run build

  # ===========================================================================
  # DEPLOY — build fresh, push clean production files to 'deploy' branch.
  # Hostinger Git connects to this branch → public_html/.
  # Only runs on pushes to main (not PRs).
  # ===========================================================================
  deploy:
    name: Deploy to Hostinger
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        run: |
          npm run build
          echo "=== dist/ contents ==="
          ls -la dist/
          echo "File count: $(find dist/ -type f | wc -l)"

      - name: Push production files to 'deploy' branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # --- CRITICAL: save dist/ outside the repo BEFORE we wipe it ---
          echo "=== Saving dist/ to /tmp/deploy-dist ==="
          cp -r dist /tmp/deploy-dist
          ls -la /tmp/deploy-dist/

          # --- Git identity ---
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # --- Create clean orphan branch (no history, no source) ---
          echo "=== Creating orphan branch ==="
          git checkout --orphan deploy-branch

          # Remove everything from the index
          git rm -rf --cached . 2>/dev/null || true

          # Wipe working tree (keep only .git)
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +

          echo "=== After wipe ==="
          ls -la

          # --- Copy production files back in from the safe copy ---
          echo "=== Restoring dist/ contents to root ==="
          cp -r /tmp/deploy-dist/* .
          rm -rf /tmp/deploy-dist

          echo "=== Final deploy files ==="
          ls -la
          find . -maxdepth 2 ! -path './.git*' -type f | sort

          # --- Commit & push ---
          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️  No changes — skipping deploy."
          else
            git commit -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                     deploy-branch:deploy --force
            echo "✅ Deployed to 'deploy' branch."
          fi
