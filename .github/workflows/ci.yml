name: CI — build & deploy to Hostinger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # BUILD — typecheck + compile (also runs on PRs for validation)
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (tsc typecheck + vite compile)
        run: npm run build

  # ===========================================================================
  # DEPLOY — push clean production files to 'deploy' branch.
  # Hostinger Git connects to this branch → public_html/.
  # Only runs on pushes to main (not PRs).
  # ===========================================================================
  deploy:
    name: Deploy to Hostinger
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        run: |
          npm run build
          echo "=== dist/ file count: $(find dist/ -type f | wc -l) ==="

      - name: Push production files to 'deploy' branch
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -e

          # --- Trim token and verify ---
          TOKEN=$(echo "${DEPLOY_TOKEN}" | tr -d '[:space:]')
          echo "Token length: ${#TOKEN}"
          if [ ${#TOKEN} -lt 30 ]; then
            echo "ERROR: Token too short!"
            exit 1
          fi

          # --- Create a FRESH git repo (no cached remotes/creds) ---
          mkdir /tmp/deploy-repo
          cd /tmp/deploy-repo
          git init
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # --- Copy production files in (use /. to include dotfiles like .htaccess) ---
          cp -r ${GITHUB_WORKSPACE}/dist/. .
          echo "=== Files to deploy ==="
          ls -la

          # --- Commit & push with PAT in URL ---
          git add -A
          git commit -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          
          echo "Pushing to ${GITHUB_REPOSITORY} (branch: deploy)"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:deploy --force
          echo "✅ Deployed to 'deploy' branch."
