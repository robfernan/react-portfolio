name: CI — typecheck & build

on:
  push:
    branches: [main, master]
  pull_request:

# Only one concurrent run per branch (cancel superseded ones).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Deploy — push built dist/ to the 'deploy' branch for Hostinger Git.
  # Hostinger connects to this branch; it only ever sees production files.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Hostinger (deploy branch)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push to deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Create a clean orphan branch with only the built files
          git checkout --orphan deploy-branch
          # Remove everything from the index and working tree
          git rm -rf --cached . 2>/dev/null || true
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          # Copy in only the production build output
          cp -r dist/* .
          rm -rf dist
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy — skipping push."
          else
            git commit -m "deploy: $(date +%Y-%m-%d\ %H:%M) [skip ci]"
            git push origin deploy-branch:deploy --force
            echo "✅ Deployed to 'deploy' branch."
          fi
