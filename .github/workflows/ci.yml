name: CI — build & deploy to Hostinger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # BUILD — typecheck + compile (also runs on PRs for validation)
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (tsc typecheck + vite compile)
        run: |
          echo "=== Starting build ==="
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          npm run build
          echo "=== Build exit code: $? ==="
          echo "=== dist/ exists? ==="
          ls -la dist/ 2>&1 || echo "WARNING: dist/ not found!"

  # ===========================================================================
  # DEPLOY — build fresh, push clean production files to 'deploy' branch.
  # Hostinger Git connects to this branch → public_html/.
  # Only runs on pushes to main (not PRs).
  # ===========================================================================
  deploy:
    name: Deploy to Hostinger
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          echo "=== Installing deps ==="
          npm ci --legacy-peer-deps
          echo "=== Install exit code: $? ==="

      - name: Build production bundle
        run: |
          echo "=== Starting build ==="
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "PWD:  $(pwd)"
          ls -la
          npm run build
          BUILD_EXIT=$?
          echo "=== Build exit code: ${BUILD_EXIT} ==="
          if [ ${BUILD_EXIT} -ne 0 ]; then
            echo "ERROR: Build failed!"
            exit 1
          fi
          echo "=== Checking dist/ ==="
          ls -la dist/ 2>&1 || { echo "FATAL: dist/ not found after build!"; exit 1; }
          echo "=== File count in dist/: $(find dist/ -type f | wc -l) ==="

      - name: Push production files to 'deploy' branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "=== Pre-push state ==="
          echo "PWD: $(pwd)"
          ls -la
          echo "dist/ contents:"
          ls -la dist/

          # --- Git identity ---
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # --- Create clean orphan branch (no history, no source) ---
          echo "=== Creating orphan branch ==="
          git checkout --orphan deploy-branch

          # Remove everything from the index
          git rm -rf --cached . 2>/dev/null || true

          # Wipe working tree (keep only .git)
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +

          echo "=== After wipe, before copy ==="
          ls -la

          # Copy in ONLY the production build output
          echo "=== Copying dist/* to root ==="
          cp -rv dist/* .
          rm -rf dist

          echo "=== Final files to deploy ==="
          ls -la
          find . -maxdepth 2 ! -path './.git*' -type f | head -30

          # --- Commit & push ---
          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️  No changes — skipping deploy."
          else
            git commit -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                     deploy-branch:deploy --force
            echo "✅ Deployed to 'deploy' branch."
          fi
